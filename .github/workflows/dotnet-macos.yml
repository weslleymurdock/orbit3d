name: Build the Engine (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'
    - name: Install MAUI workloads
      run: dotnet workload install maui --version 10.0.302.1
    - name: Restore dependencies - Orbit.Engine
      run: dotnet restore engine/Orbit.Engine/Orbit.Engine.csproj
    - name: Restore dependencies - Orbit.Input
      run: dotnet restore engine/Orbit.Input/Orbit.Input.csproj
    - name: Restore dependencies - Orbit3D.Engine
      run: dotnet restore engine/Orbit3D.Engine/Orbit3D.Engine.csproj
    - name: Restore dependencies - Orbit3D.Graphics.Silk
      run: dotnet restore engine/Orbit3D.Graphics.Silk/Orbit3D.Graphics.Silk.csproj
    - name: Restore dependencies - Orbit.Engine.Tests
      run: dotnet restore engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj
    - name: Restore dependencies - Orbit3D.Engine.Tests
      run: dotnet restore engine/Orbit3D.Engine.Tests/Orbit3D.Engine.Tests.csproj
    - name: Build Orbit.Engine
      run: dotnet build engine/Orbit.Engine/Orbit.Engine.csproj --no-restore -c Release -f net10.0 -f net10.0-ios -f net10.0-maccatalyst
    - name: Build Orbit.Input
      run: dotnet build engine/Orbit.Input/Orbit.Input.csproj --no-restore -c Release -f net10.0 -f net10.0-ios -f net10.0-maccatalyst
    - name: Build Orbit3D.Engine
      run: dotnet build engine/Orbit3D.Engine/Orbit3D.Engine.csproj --no-restore -c Release -f net10.0 -f net10.0-ios -f net10.0-maccatalyst
    - name: Build Orbit3D.Graphics.Silk
      run: dotnet build engine/Orbit3D.Graphics.Silk/Orbit3D.Graphics.Silk.csproj --no-restore -c Release -f net10.0 -f net10.0-ios -f net10.0-maccatalyst
    - name: Run Orbit.Engine.Tests (net10.0)
      run: dotnet test engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj -c Release -f net10.0 --results-directory artifacts/test-results --logger "trx;LogFileName=Orbit.Engine.Tests-macos.trx"
    - name: Run Orbit3D.Engine.Tests (net10.0)
      run: dotnet test engine/Orbit3D.Engine.Tests/Orbit3D.Engine.Tests.csproj -c Release -f net10.0 --results-directory artifacts/test-results --logger "trx;LogFileName=Orbit3D.Engine.Tests-macos.trx"
    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-macos
        path: artifacts/test-results/**/*.trx
