name: Build the Engine and 3D Sample Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Engine (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.100'
    - name: workload install
      run: dotnet workload install maui
    - name: Restore dependencies - engine
      run: dotnet restore engine/Orbit.Engine/Orbit.Engine.csproj
    - name: Restore dependencies - input
      run: dotnet restore engine/Orbit.Input/Orbit.Input.csproj
    - name: Restore dependencies - tests
      run: dotnet restore engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj
    - name: Build engine
      run: dotnet build engine/Orbit.Engine/Orbit.Engine.csproj --no-restore -c Release
    - name: Build input
      run: dotnet build engine/Orbit.Input/Orbit.Input.csproj --no-restore -c Release

    - name: Run tests
      run: dotnet test engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj --no-restore

  sample-3d-validation:
    name: 3D Sample Validation (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: net10.0-windows10.0.19041.0
            workloads: maui-windows
            enable-ui-tests: true
          - platform: Android
            os: ubuntu-latest
            target: net10.0-android
            workloads: android
            enable-ui-tests: false
          - platform: iOS
            os: macos-26
            target: net10.0-ios
            workloads: ios
            enable-ui-tests: true
          - platform: MacCatalyst
            os: macos-26
            target: net10.0-maccatalyst
            workloads: maccatalyst
            enable-ui-tests: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Java JDK (Android)
      if: matrix.platform == 'Android'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: maxim-lobanov/setup-xcode@v1
      if: matrix.os == 'macos-26'
      with:
        xcode-version: '26.0'

    - name: Setup Apple Host and Diagnostics (iOS and MacCatalyst)
      if: matrix.platform == 'iOS' || matrix.platform == 'MacCatalyst'
      run: |
        echo "=== macOS and Xcode Diagnostics ==="
        sw_vers
        xcode-select -p
        xcodebuild -version
        sudo xcodebuild -runFirstLaunch 2>&1 || true
        sudo xcodebuild -downloadPlatform iOS 2>&1 || true
        echo "=== Available Simulators ==="
        xcrun simctl list devices available
        xcrun simctl list runtimes

    - name: Prepare iOS Simulator (iOS)
      if: matrix.platform == 'iOS'
      shell: pwsh
      run: |
        $simctlJson = xcrun simctl list -j | ConvertFrom-Json
        $iosRuntimes = $simctlJson.runtimes | Where-Object { $_.isAvailable -and $_.platform -eq "iOS" }

        Write-Host "=== Available iOS Simulator Runtimes ==="
        $iosRuntimes | ForEach-Object { Write-Host " - $($_.name) ($($_.identifier), build $($_.buildversion))" }

        if (-not $iosRuntimes) {
          Write-Error "No available iOS simulator runtimes found on this macOS runner."
          exit 1
        }

        # Select compatible iOS runtime for the active Xcode
        $targetRuntime = $iosRuntimes | Select-Object -Last 1
        Write-Host "Selected iOS Runtime: $($targetRuntime.name) ($($targetRuntime.identifier))"

        $runtimeId = $targetRuntime.identifier
        $devices = $simctlJson.devices.PSObject.Properties[$runtimeId]?.Value | Where-Object { $_.isAvailable -and $_.name -like "*iPhone*" }

        $selectedUdid = $null
        if ($devices) {
          $preferred = $devices | Where-Object { $_.name -eq "iPhone 16" } | Select-Object -First 1
          if (-not $preferred) { $preferred = $devices | Select-Object -First 1 }
          $selectedUdid = $preferred.udid
          Write-Host "Found available simulator: $($preferred.name) ($selectedUdid)"
        } else {
          Write-Host "Creating iPhone 16 simulator for runtime $runtimeId..."
          $selectedUdid = xcrun simctl create "Orbit3D-iPhone16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" $runtimeId
          Write-Host "Created simulator with UDID: $selectedUdid"
        }

        Write-Host "Booting iOS Simulator $selectedUdid..."
        xcrun simctl boot $selectedUdid 2>$null || true

        Write-Host "Waiting for iOS Simulator to complete boot..."
        xcrun simctl bootstatus $selectedUdid -b

        Write-Host "Simulator successfully booted."
        "ORBIT3D_IOS_SIMULATOR_UDID=$selectedUdid" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Exported ORBIT3D_IOS_SIMULATOR_UDID=$selectedUdid to GITHUB_ENV."

    - name: Setup .NET with Workload
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.100'
    - name: Install workloads
      run: dotnet workload install maui ${{ matrix.workloads }}
    - name: Print Toolchain Diagnostics
      shell: pwsh
      run: |
        Write-Host "=== .NET SDK Info ==="
        dotnet --info

    - name: Build Sample Application in Release
      shell: pwsh
      run: |
        dotnet build games/3D/SilkTriangleSample/SilkTriangleSample.csproj `
          --configuration Release `
          -f ${{ matrix.target }}

    - name: Validate Application Build Artifact
      shell: pwsh
      run: |
        .\scripts\validate-artifacts.ps1 -Platform ${{ matrix.platform }} -Configuration Release

    - name: Setup Node.js and Appium
      if: matrix.enable-ui-tests
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install Appium and Platform Driver
      if: matrix.enable-ui-tests
      shell: pwsh
      run: |
        npm install -g appium
        if ('${{ matrix.platform }}' -eq 'Windows') {
          appium driver install windows
        } elseif ('${{ matrix.platform }}' -eq 'iOS') {
          appium driver install xcuitest
        } elseif ('${{ matrix.platform }}' -eq 'Android') {
          appium driver install uiautomator2
        } elseif ('${{ matrix.platform }}' -eq 'MacCatalyst') {
          appium driver install mac2
        }

    - name: Start Appium Server
      if: matrix.enable-ui-tests
      shell: pwsh
      run: |
        if ($IsWindows) {
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c appium --address 127.0.0.1 --port 4723 --log appium.log" -WindowStyle Hidden
        } else {
          Start-Process -FilePath "appium" -ArgumentList "--address 127.0.0.1 --port 4723 --log appium.log"
        }

        $timeoutSeconds = 60
        $deadline = (Get-Date).AddSeconds($timeoutSeconds)
        $ready = $false
        Write-Host "Waiting for Appium server to respond on http://127.0.0.1:4723/status..."

        while ((Get-Date) -lt $deadline) {
            try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4723/status" -TimeoutSec 2 -ErrorAction Stop
                if ($resp.value.ready -eq $true -or $resp.value) {
                    $ready = $true
                    Write-Host "Appium server is ready and responding."
                    break
                }
            } catch {
                Start-Sleep -Seconds 2
            }
        }

        if (-not $ready) {
            Write-Error "Appium server failed to become ready within $timeoutSeconds seconds."
            if (Test-Path appium.log) {
                Write-Host "=== Appium Server Log ==="
                Get-Content appium.log
            }
            exit 1
        }

    - name: Build UI Test Runner
      if: matrix.enable-ui-tests
      shell: pwsh
      run: |
        dotnet build games/3D/SilkTriangleSample.UITests/SilkTriangleSample.UITests.csproj `
          --configuration Release

    - name: Run UI Tests
      if: matrix.enable-ui-tests
      shell: pwsh
      run: |
        Write-Host "Verifying UI test discovery for Platform=${{ matrix.platform }}..."
        $listOutput = dotnet test games/3D/SilkTriangleSample.UITests/SilkTriangleSample.UITests.csproj `
          --configuration Release `
          --no-build `
          --filter "Platform=${{ matrix.platform }}" `
          --list-tests

        Write-Host ($listOutput | Out-String)

        $discovered = $listOutput | Where-Object { $_ -match "^\s+SilkTriangleSample\.UITests\." }
        if ($discovered.Count -eq 0) {
          Write-Error "No UI tests discovered for Platform=${{ matrix.platform }}. Failing validation to prevent false positives."
          exit 1
        }
        Write-Host "Discovered $($discovered.Count) tests for Platform=${{ matrix.platform }}."

        dotnet test games/3D/SilkTriangleSample.UITests/SilkTriangleSample.UITests.csproj `
          --configuration Release `
          --no-build `
          --filter "Platform=${{ matrix.platform }}" `
          --logger "trx;LogFileName=test-results-${{ matrix.platform }}.trx"

    - name: Upload Test Results and Failure Diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: diagnostics-${{ matrix.platform }}
        path: |
          artifacts/uitests/**
          artifacts/installation/**
          **/*.trx
          appium.log
